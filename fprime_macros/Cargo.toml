[package]
name = "fprime_macros"
description = "Procedural macros backing the fprime-wasm sequencing DSL and Wasm entry point"
readme = "README.md"
keywords = ["fprime", "wasm", "macros", "spacecraft", "no-std"]
categories = ["aerospace", "no-std", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true
name = "fprime_macros"
path = "src/lib.rs"

[dependencies]
fprime_dictionary = { path = "../fprime_dictionary", version = "=0.0.0" }
proc-macro2 = "1.0.103"
quote = "1.0.41"
syn = { version = "2.0.108", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
