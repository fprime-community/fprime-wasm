[package]
name = "fprime-wasm"
description = "Create and inspect F Prime Wasm sequence projects: scaffold a crate, add sequences, and size a module against the on-board interpreter"
readme = "README.md"
keywords = ["fprime", "wasm", "spacecraft", "sequencer", "cli"]
categories = ["aerospace", "command-line-utilities", "wasm", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fprime_wasm"
path = "src/lib.rs"

[[bin]]
name = "fprime-wasm"
path = "src/cmd/main.rs"

[dependencies]
fprime_dictionary = { path = "../fprime_dictionary", version = "=0.0.0" }
fprime_test = { path = "../fprime_test", version = "=0.0.0" }
# The linker, and `backtrace`'s symbol files; see `fprime_test`'s dependency on it.
spacewasm_tools = { version = "=0.8.0-rc.2", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# binaryen's `wasm-opt`, embedded so a release link runs the one this release was tested
# with. Built by `fprime_wasm_opt/package.sh`; one per host, each `cfg` matching one in
# `src/cmd/wasm_opt.rs`. `=` so a new binaryen is a deliberate bump.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
fprime-wasm-opt-x86_64-linux = "=133.0.0"
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
fprime-wasm-opt-aarch64-linux = "=133.0.0"
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fprime-wasm-opt-arm64-macos = "=133.0.0"
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fprime-wasm-opt-x86_64-macos = "=133.0.0"
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
fprime-wasm-opt-x86_64-windows = "=133.0.0"
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
fprime-wasm-opt-arm64-windows = "=133.0.0"
