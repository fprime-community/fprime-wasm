[target.wasm32v1-none]
linker = "target/debug/fprime-wasm"
rustflags = [
    # `spacewasm features --rustc`: the same set, for the compiler.
    "-Ctarget-cpu=mvp",
    "-Ctarget-feature=+mutable-globals,+sign-ext,+nontrapping-fptoint,-bulk-memory,-reference-types,-multivalue,-extended-const,-simd128,-tail-call",
    "-Clink-args=-zstack-size=512",
    "-Clink-arg=--page-size=1",
]

[env]
# Optimisation only; the feature set is the linker's to choose.
SPACEWASM_OPT = "--low-memory-unused --converge -Os"
