name: Rust

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the job that comments raises its own.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32v1-none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Test the host crates
        run: cargo test -p fprime_dictionary -p fprime_build -p fprime_macros -p wasm_size

      - name: Build the wasm crates
        run: cargo build --release --target wasm32v1-none -p bench -p example

  size:
    name: size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32v1-none

      - name: Install binaryen
        env:
          BINARYEN_VERSION: version_132
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        working-directory: ${{ runner.temp }}
        run: |
          tarball="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"

          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$tarball"
          echo "$BINARYEN_SHA256  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball"

          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            base-target
          key: size-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: size-${{ runner.os }}-

      - name: Measure this revision
        run: cargo run -q -p wasm_size -- measure --json head.json

      - name: Check out the base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Measure the base revision
        if: github.event_name == 'pull_request'
        id: base
        continue-on-error: true
        working-directory: base
        run: cargo run -q -p wasm_size -- measure --target-dir ../base-target --json ../base.json

      - name: Build the report
        id: report
        # Through the environment rather than interpolated into the script: a
        # branch name is attacker-chosen text on a fork pull request.
        #
        # Sources are linked at the head repository and commit, so a fork's table
        # points into the fork and every link keeps resolving once the branch has
        # moved on.
        env:
          BASE_LABEL: ${{ github.event.pull_request.base.ref || 'BASE' }}
          SOURCE_BASE: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}/blob/${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## Wasm size'
            echo
            if [ -f base.json ]; then
              cargo run -q -p wasm_size -- compare \
                --base-label "$BASE_LABEL" --source-base "$SOURCE_BASE" \
                base.json head.json
              echo
              echo "Compared against \`${{ github.event.pull_request.base.sha || github.sha }}\`."
            else
              echo 'No baseline to compare against, reporting absolute sizes.'
              echo
              cargo run -q -p wasm_size -- measure
            fi
            echo
            echo '<sub>Measured after `wasm-opt --enable-custom-page-sizes -Os`.'
            echo '`Code` is function bodies, `Data` is initialised memory. A'
            echo 'const-encoded command moves its payload from code into data.</sub>'
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: |
            report.md
            head.json

      # Fork pull requests get a read-only token, so the API write would fail.
      # The job summary above still carries the table.
      - name: Comment on the pull request
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- fprime-wasm-size -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // One sticky comment, identified by the marker, so a busy pull
            // request does not accumulate a size comment per push.
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
