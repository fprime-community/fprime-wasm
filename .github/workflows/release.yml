name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# The publish job creates the draft GitHub release, the binaries job uploads to
# it, and the release job publishes it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every tag, so the release notes can start from the previous release.
          fetch-depth: 0

      - name: Refuse a release that is already published
        # With immutable releases on, a published release takes no more assets,
        # so the binaries below could never be attached to it. That is what
        # happens when the release is created from the GitHub UI before the
        # workflow runs. Fail here, before any crate version is used up on
        # crates.io. A draft (a re-run of this workflow) is fine.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null) \
            && [ "$draft" != "true" ]; then
            echo "::error::Release $tag is already published, so its assets can no longer be uploaded. Push only the tag, and let this workflow create the release. Release under a new tag."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        # Pinned to the Swatinem/rust-cache v2.9.2 release commit.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false

      # The release profile links the Wasm crates through `fprime-wasm`, which
      # runs the optimiser.
      - uses: ./.github/actions/binaryen

      - name: Inject version from tag
        uses: ./.github/actions/inject-version
        with:
          version: ${{ github.ref_name }}

      # The linker `.cargo/config.toml` names: this checkout's own, so a change to it
      # is what builds the sequences below.
      - name: Build the linker
        run: cargo build -p fprime-wasm

      - name: Build the sequences
        # Cheap, and it is the only thing that proves the released fprime_core,
        # fprime_macros and fprime_build still compile a sequence for the target
        # they exist to serve.
        run: |
          cargo build --release --target wasm32v1-none \
            -p bench -p example -p interp --features wasm

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Verify the sequences load on the on-board interpreter
        # A sequence can build and still fail to load: `spacewasm` implements
        # WebAssembly 1.0 plus a few post-MVP proposals only, and `wasm-opt` can
        # introduce others while optimising. This gate is why the linker pins its
        # feature set.
        #
        # Run from the workspace root with explicit paths: `crates/example` has a
        # `.cargo/config.toml` that targets wasm32v1-none, so cargo invoked from
        # there would try to build the tool itself for Wasm.
        run: |
          cargo run -p fprime-wasm -- verify \
            target/wasm32v1-none/release/*.wasm

      - name: Create the draft GitHub release
        # A draft, because an immutable release takes no assets once published:
        # the binaries are uploaded into the draft, and the `release` job
        # publishes it only after every one of them is there. Created before
        # anything goes to crates.io, which cannot be undone, so that a failure
        # here costs nothing. A draft is visible only to maintainers.
        #
        # The notes start from the previous final release, so release
        # candidates are skipped: v0.2.0-rc.2 and v0.2.0 both list everything
        # since v0.1.10, rather than v0.2.0 listing only what changed since
        # its last release candidate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Draft release $tag already exists; leaving its notes untouched."
            exit 0
          fi

          # `v0.2.0-rc.2` is a prerelease of `v0.2.0`.
          core="${tag%%-*}"
          flags=()
          if [ "$core" != "$tag" ]; then
            flags+=(--prerelease)
          fi
          # The newest final release older than this one.
          previous=$(
            git tag --list 'v[0-9]*' | grep -v -e '-' | { cat; echo "$core"; } \
              | sort -uV | awk -v core="$core" '$0 == core { print last; exit } { last = $0 }'
          )
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          echo "Notes for $tag start from ${previous:-the first commit}."
          gh release create "$tag" --draft --verify-tag --generate-notes "${flags[@]}"

      - name: Publish crates to crates.io
        # Published in dependency (topological) order so each crate's internal
        # dependencies are already on the index. `cargo` waits for each crate to
        # appear there before returning.
        #
        # --allow-dirty: the injected version is an uncommitted working-tree
        # change.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Ordered by the internal dependency graph: a crate only appears after
          # every workspace crate it depends on.
          #
          #   fprime_dictionary  (no internal dependencies)
          #   fprime_macros      -> fprime_dictionary
          #   fprime_core        -> fprime_macros
          #   fprime_build       -> fprime_dictionary
          #   fprime_test        -> fprime_core, fprime_dictionary
          #   fprime-wasm        -> fprime_test, fprime_dictionary
          crates=(
            fprime_dictionary
            fprime_macros
            fprime_core
            fprime_build
            fprime_test
            fprime-wasm
          )

          # Drift guard: fail fast if a publishable workspace member is missing
          # from (or stale in) the ordered list above. Without this, a newly
          # added crate surfaces only as an unresolvable dependency mid-publish,
          # after some crates are already irreversibly published.
          expected=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          listed=$(printf '%s\n' "${crates[@]}" | sort)
          if [ "$expected" != "$listed" ]; then
            echo "::error::release.yml crate list is out of sync with the workspace."
            echo "Only in workspace: $(comm -23 <(echo "$expected") <(echo "$listed") | tr '\n' ' ')"
            echo "Only in list:      $(comm -13 <(echo "$expected") <(echo "$listed") | tr '\n' ' ')"
            exit 1
          fi

          # True if $crate@$version already exists on the crates.io index. Makes
          # the loop idempotent, so a re-run after a partial failure (e.g. the
          # new-crate rate limit) skips what already published.
          #
          # crates.io rejects requests without a User-Agent (HTTP 403), so one is
          # required here or the check would always report "not published".
          already_published() {
            local crate="$1"
            curl -sf -A "fprime-wasm-release-ci (https://github.com/fprime-community/fprime-wasm)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }

          for crate in "${crates[@]}"; do
            echo "::group::Publishing $crate v$version"
            if already_published "$crate"; then
              echo "$crate v$version is already on crates.io; skipping."
              echo "::endgroup::"
              continue
            fi

            # Retry ONLY to ride out crates.io's new-crate rate limit (HTTP 429).
            # crates.io allows a burst of ~5 brand-new crate names, then refills
            # one token roughly every 10 minutes; a first release of this
            # workspace publishes 6 new names and will trip it. Any other failure
            # (an unresolved dependency, a failed verification build) is
            # permanent, so fail fast rather than retry for over an hour.
            attempt=1
            max_attempts=8
            while true; do
              if cargo publish -p "$crate" --allow-dirty 2>&1 | tee /tmp/publish.log; then
                break
              fi
              if already_published "$crate"; then
                echo "$crate v$version appeared on crates.io after the attempt; continuing."
                break
              fi
              if ! grep -qiE '429|too many requests|rate limit' /tmp/publish.log; then
                echo "::error::publish of $crate v$version failed for a non-rate-limit reason (see the log above); not retrying."
                exit 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to publish $crate v$version after $max_attempts rate-limited attempts."
                exit 1
              fi
              echo "::warning::$crate hit the crates.io new-crate rate limit (attempt $attempt/$max_attempts); waiting 11min for a token to refill before retrying."
              sleep 660
              attempt=$((attempt + 1))
            done
            echo "::endgroup::"
          done

  binaries:
    name: Binary (${{ matrix.target }})
    # The release has to exist before anything can be uploaded to it, and there
    # is no point shipping a binary for a version that failed to publish.
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      # One unavailable runner or one target-specific build problem should not
      # cost the other binaries: the crates are already published either way.
      fail-fast: false
      matrix:
        include:
          # Linux binaries are `musl`, so static: a glibc build from ubuntu-latest
          # would need that runner's glibc and fail to start on older
          # distributions. `cargo binstall` on a glibc host falls back to the
          # musl target. Each is built natively, so no cross linker or emulation
          # is involved.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            packages: musl-tools
          - target: aarch64-apple-darwin
            runner: macos-15
          # Cross-compiled: GitHub is retiring its Intel macOS runners, and Apple's
          # toolchain links either architecture from an arm64 host with nothing
          # extra installed.
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        # Pinned to the Swatinem/rust-cache v2.9.2 release commit.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Inject version from tag
        # The binary bakes in its own version through CARGO_PKG_VERSION, and
        # `fprime-wasm init` uses it to pin the crates a scaffolded project
        # depends on. Without this a released binary would scaffold against
        # 0.0.0, which does not exist.
        uses: ./.github/actions/inject-version
        with:
          version: ${{ github.ref_name }}

      - name: Build
        # No --locked: `inject-version` changed the workspace version, so the
        # checked-in Cargo.lock is stale by construction and cargo has to refresh it.
        run: cargo build --release --target ${{ matrix.target }} -p fprime-wasm

      - name: Verify the binary reports the release version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/fprime-wasm"
          [ -f "$binary" ] || binary="$binary.exe"

          # Every target but x86_64-apple-darwin is built on a runner of its own
          # architecture. That one runs under Rosetta where the runner image has
          # it; otherwise only its architecture can be checked.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if ! lipo "$binary" -verify_arch x86_64; then
              echo "::error::$binary is not an x86_64 executable."
              exit 1
            fi
            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::warning::Rosetta is not available on this runner; skipping the version check for $binary."
              exit 0
            fi
            binary="arch -x86_64 $binary"
          fi

          reported=$($binary --version | awk '{print $2}')
          expected="${VERSION#v}"
          if [ "$reported" != "$expected" ]; then
            echo "::error::the built binary reports version $reported, expected $expected. 'fprime-wasm init' would scaffold projects against the wrong crate version."
            exit 1
          fi
          echo "fprime-wasm $reported"

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This name and the staging directory match a `cargo binstall` default
          # pattern, which is why no [package.metadata.binstall] is needed.
          # Renaming either breaks `cargo binstall` silently: it falls back to
          # building from source.
          name="fprime-wasm-${VERSION}-${{ matrix.target }}"
          staging="$name"
          mkdir -p "$staging"
          cp README.md LICENSE "$staging/"
          cp fprime_wasm/README.md "$staging/README-fprime-wasm.md"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/fprime-wasm.exe" "$staging/"
            7z a "$name.zip" "$staging" >/dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/fprime-wasm" "$staging/"
            tar czf "$name.tar.gz" "$staging"
            archive="$name.tar.gz"
          fi

          # Checksums travel with the archive so a download can be verified
          # without trusting the transport.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          cat "$archive.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # --clobber so re-running the workflow for a tag replaces the assets
          # rather than failing on the ones already there.
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

  release:
    name: Publish the GitHub release
    # Only once every binary is in the draft: publishing makes the release
    # immutable, so a binary that failed to upload could never be added. If one
    # failed, re-run the failed jobs; the release stays a draft until then.
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # A release candidate is never "Latest".
          if [ "${tag%%-*}" != "$tag" ]; then
            latest=false
          else
            latest=true
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'

  binstall:
    name: Verify cargo binstall (${{ matrix.runner }})
    # A misnamed archive does not fail `cargo binstall`, it quietly compiles from
    # source instead. Install the release exactly as a user would, with every
    # fallback disabled, so a packaging mistake fails the release instead.
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # glibc hosts, so these also exercise the fallback to the musl binaries.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Install cargo-binstall
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-binstall

      - name: Install fprime-wasm from the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # `crate-meta-data` alone: the release assets, never cargo-quickinstall
          # or a source build.
          cargo binstall "fprime-wasm@$version" --no-confirm --strategies crate-meta-data
          reported=$(fprime-wasm --version | awk '{print $2}')
          if [ "$reported" != "$version" ]; then
            echo "::error::cargo binstall installed fprime-wasm $reported, expected $version."
            exit 1
          fi
