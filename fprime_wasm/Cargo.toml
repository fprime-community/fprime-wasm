[package]
name = "fprime-wasm"
description = "Create and inspect F Prime Wasm sequence projects: scaffold a crate, add sequences, and size a module against the on-board interpreter"
readme = "README.md"
keywords = ["fprime", "wasm", "spacecraft", "sequencer", "cli"]
categories = ["aerospace", "command-line-utilities", "wasm", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Where `cargo binstall` finds the prebuilt binaries that
# `.github/workflows/release.yml` attaches to each GitHub release. Both
# templates have to be spelled out: binstall's defaults look under
# `/download/{version}/` rather than `/download/v{version}/`, name the asset
# `{name}-{target}-v{version}` rather than `{name}-v{version}-{target}`, and do
# not expect the staging directory the release archives are built around.
#
# No `pkg-fmt`: binstall probes every archive suffix, so these two lines cover
# the Unix `.tar.gz` and the Windows `.zip` alike.
#
# `{ version }` is the published crate version, which the release workflow keeps
# equal to the tag, so `v{ version }` resolves to the tag that holds the assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[lib]
name = "fprime_wasm"
path = "src/lib.rs"

[[bin]]
name = "fprime-wasm"
path = "src/cmd/main.rs"

[dependencies]
fprime_dictionary = { path = "../fprime_dictionary", version = "=0.0.0" }
fprime_test = { path = "../fprime_test", version = "=0.0.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
