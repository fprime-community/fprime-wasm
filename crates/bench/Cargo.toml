[package]
name = "bench"
version.workspace = true
edition.workspace = true
publish = false

[features]
# The benchmark bins are `#![no_std] #![no_main]` Wasm modules: they cannot link
# for the host, so a bare `cargo build --workspace` must skip them. This feature
# is what `required-features` on each `[[bin]]` keys off.
wasm = []

[dependencies]
fprime_core = { path = "../../fprime_core" }

[build-dependencies]
fprime_build = { path = "../../fprime_build" }

[lib]
test = false
bench = false

[[bin]]
name = "baseline"
required-features = ["wasm"]
test = false
bench = false

