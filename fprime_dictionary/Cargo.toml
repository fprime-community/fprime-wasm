[package]
name = "fprime_dictionary"
description = "Deserialisation of F Prime JSON dictionaries, shared by the fprime-wasm build and tooling crates"
readme = "README.md"
keywords = ["fprime", "dictionary", "spacecraft", "wasm"]
categories = ["aerospace", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
proc-macro2 = "1.0.103"
quote = "1.0.42"

[dev-dependencies]
pretty_assertions = "1.4.1"
