name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# The publish job creates the GitHub release; the binaries job uploads to it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        # Pinned to the Swatinem/rust-cache v2.9.2 release commit.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false

      # The release profile links the Wasm crates through .cargo/wasm-link, which
      # runs the optimiser.
      - uses: ./.github/actions/binaryen

      - name: Inject version from tag
        uses: ./.github/actions/inject-version
        with:
          version: ${{ github.ref_name }}

      - name: Build the sequences
        # Cheap, and it is the only thing that proves the released fprime_core,
        # fprime_macros and fprime_build still compile a sequence for the target
        # they exist to serve.
        run: |
          cargo build --release --target wasm32v1-none \
            -p bench -p example -p interp --features wasm

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Verify the sequences load on the on-board interpreter
        # A sequence can build and still fail to load: `spacewasm` implements
        # WebAssembly 1.0 plus mutable-globals and custom-page-sizes only, and
        # `wasm-opt` can introduce post-MVP instructions while optimising. This
        # gate is why .cargo/wasm-link pins its feature set.
        #
        # Run from the workspace root with explicit paths: `crates/example` has a
        # `.cargo/config.toml` that targets wasm32v1-none, so cargo invoked from
        # there would try to build the tool itself for Wasm.
        run: |
          cargo run -p fprime-wasm -- verify \
            target/wasm32v1-none/release/*.wasm

      - name: Publish crates to crates.io
        # Published in dependency (topological) order so each crate's internal
        # dependencies are already on the index. `cargo` waits for each crate to
        # appear there before returning.
        #
        # --allow-dirty: the injected version is an uncommitted working-tree
        # change.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Ordered by the internal dependency graph: a crate only appears after
          # every workspace crate it depends on.
          #
          #   fprime_dictionary  (no internal dependencies)
          #   fprime_macros      -> fprime_dictionary
          #   fprime_core        -> fprime_macros
          #   fprime_build       -> fprime_dictionary
          #   fprime_test        -> fprime_core, fprime_dictionary
          #   fprime-wasm        -> fprime_test, fprime_dictionary
          crates=(
            fprime_dictionary
            fprime_macros
            fprime_core
            fprime_build
            fprime_test
            fprime-wasm
          )

          # Drift guard: fail fast if a publishable workspace member is missing
          # from (or stale in) the ordered list above. Without this, a newly
          # added crate surfaces only as an unresolvable dependency mid-publish,
          # after some crates are already irreversibly published.
          expected=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          listed=$(printf '%s\n' "${crates[@]}" | sort)
          if [ "$expected" != "$listed" ]; then
            echo "::error::release.yml crate list is out of sync with the workspace."
            echo "Only in workspace: $(comm -23 <(echo "$expected") <(echo "$listed") | tr '\n' ' ')"
            echo "Only in list:      $(comm -13 <(echo "$expected") <(echo "$listed") | tr '\n' ' ')"
            exit 1
          fi

          # True if $crate@$version already exists on the crates.io index. Makes
          # the loop idempotent, so a re-run after a partial failure (e.g. the
          # new-crate rate limit) skips what already published.
          #
          # crates.io rejects requests without a User-Agent (HTTP 403), so one is
          # required here or the check would always report "not published".
          already_published() {
            local crate="$1"
            curl -sf -A "fprime-wasm-release-ci (https://github.com/fprime-community/fprime-wasm)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }

          for crate in "${crates[@]}"; do
            echo "::group::Publishing $crate v$version"
            if already_published "$crate"; then
              echo "$crate v$version is already on crates.io; skipping."
              echo "::endgroup::"
              continue
            fi

            # Retry ONLY to ride out crates.io's new-crate rate limit (HTTP 429).
            # crates.io allows a burst of ~5 brand-new crate names, then refills
            # one token roughly every 10 minutes; a first release of this
            # workspace publishes 6 new names and will trip it. Any other failure
            # (an unresolved dependency, a failed verification build) is
            # permanent, so fail fast rather than retry for over an hour.
            attempt=1
            max_attempts=8
            while true; do
              if cargo publish -p "$crate" --allow-dirty 2>&1 | tee /tmp/publish.log; then
                break
              fi
              if already_published "$crate"; then
                echo "$crate v$version appeared on crates.io after the attempt; continuing."
                break
              fi
              if ! grep -qiE '429|too many requests|rate limit' /tmp/publish.log; then
                echo "::error::publish of $crate v$version failed for a non-rate-limit reason (see the log above); not retrying."
                exit 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to publish $crate v$version after $max_attempts rate-limited attempts."
                exit 1
              fi
              echo "::warning::$crate hit the crates.io new-crate rate limit (attempt $attempt/$max_attempts); waiting 11min for a token to refill before retrying."
              sleep 660
              attempt=$((attempt + 1))
            done
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        # Do NOT use an action that regenerates notes unconditionally: if the
        # release already exists (e.g. created from the GitHub UI, which also
        # creates the tag that triggers this workflow), generate_release_notes
        # *appends* a second copy of the changelog to the existing body
        # (softprops/action-gh-release#827). Generate notes only when creating a
        # brand-new release so the changelog is written exactly once.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its notes untouched."
          else
            gh release create "$tag" --generate-notes --verify-tag
          fi

  binaries:
    name: ${{ matrix.target }}
    # The release has to exist before anything can be uploaded to it, and there
    # is no point shipping a binary for a version that failed to publish.
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      # One unavailable runner or one target-specific build problem should not
      # cost the other binaries: the crates are already published either way.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # Built natively on an arm64 runner rather than cross-compiled, so no
          # cross linker or emulation is involved. `musl` makes it static, which
          # is what makes one arm64 Linux tarball work across distributions.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            packages: musl-tools
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        # Pinned to the Swatinem/rust-cache v2.9.2 release commit.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Inject version from tag
        # The binary bakes in its own version through CARGO_PKG_VERSION, and
        # `fprime-wasm init` uses it to pin the crates a scaffolded project
        # depends on. Without this a released binary would scaffold against
        # 0.0.0, which does not exist.
        uses: ./.github/actions/inject-version
        with:
          version: ${{ github.ref_name }}

      - name: Build
        # No --locked: `inject-version` changed the workspace version, so the
        # checked-in Cargo.lock is stale by construction and cargo has to refresh it.
        run: cargo build --release --target ${{ matrix.target }} -p fprime-wasm

      - name: Verify the binary reports the release version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/fprime-wasm"
          [ -f "$binary" ] || binary="$binary.exe"

          # Every target is built on a runner of its own architecture, so the
          # binary can be executed here rather than only inspected.
          reported=$("$binary" --version | awk '{print $2}')
          expected="${VERSION#v}"
          if [ "$reported" != "$expected" ]; then
            echo "::error::the built binary reports version $reported, expected $expected. 'fprime-wasm init' would scaffold projects against the wrong crate version."
            exit 1
          fi
          echo "fprime-wasm $reported"

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="fprime-wasm-${VERSION}-${{ matrix.target }}"
          staging="$name"
          mkdir -p "$staging"
          cp README.md LICENSE "$staging/"
          cp fprime_wasm/README.md "$staging/README-fprime-wasm.md"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/fprime-wasm.exe" "$staging/"
            7z a "$name.zip" "$staging" >/dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/fprime-wasm" "$staging/"
            tar czf "$name.tar.gz" "$staging"
            archive="$name.tar.gz"
          fi

          # Checksums travel with the archive so a download can be verified
          # without trusting the transport.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          cat "$archive.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # --clobber so re-running the workflow for a tag replaces the assets
          # rather than failing on the ones already there.
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
