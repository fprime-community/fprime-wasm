name: Rust

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the job that comments raises its own.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32v1-none

      # The wasm build below is a release build, so the linker wrapper runs the
      # optimiser and needs it present.
      - uses: ./.github/actions/binaryen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Test the host crates
        run: cargo test -p fprime_dictionary -p fprime_build -p fprime_macros -p wasm_size -p fprime-wasm

      # A sequence bin cannot link for the host, so every one in `crates/bench` and
      # `crates/example` is declared `required-features = ["wasm"]` and a host build
      # of the workspace skips it. Nothing else enforces that: a new bin added
      # without the gate breaks this command and no other step notices, because
      # every other step names its packages explicitly.
      - name: Build the workspace for the host
        run: cargo build --workspace

      # `--features wasm` is not optional: the sequence bins are gated behind it
      # so that `cargo build --workspace` on a host target skips them instead of
      # failing to link a `#![no_main]` Wasm module. Without it this step builds
      # the two dictionary libs and no `.wasm` at all, and the verify below has
      # nothing to look at.
      - name: Build the wasm crates
        run: cargo build --release --target wasm32v1-none -p bench -p example --features wasm

      - name: Verify the sequences against the on-board interpreter
        run: |
          cargo run -p fprime-wasm -- verify \
            --dictionary fprime_dictionary/src/test/RefTopologyDictionary.json \
            target/wasm32v1-none/release/*.wasm

  size:
    name: size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32v1-none

      - uses: ./.github/actions/binaryen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            base-target
          key: size-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: size-${{ runner.os }}-

      - name: Measure this revision
        run: cargo run -q -p wasm_size -- measure --json head.json

      - name: Check out the base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Measure the base revision
        if: github.event_name == 'pull_request'
        id: base
        continue-on-error: true
        working-directory: base
        run: cargo run -q -p wasm_size -- measure --target-dir ../base-target --json ../base.json

      - name: Build the report
        id: report
        # Through the environment rather than interpolated into the script: a
        # branch name is attacker-chosen text on a fork pull request.
        #
        # Sources are linked at the head repository and commit, so a fork's table
        # points into the fork and every link keeps resolving once the branch has
        # moved on.
        env:
          BASE_LABEL: ${{ github.event.pull_request.base.ref || 'BASE' }}
          SOURCE_BASE: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}/blob/${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## Wasm size'
            echo
            if [ -f base.json ]; then
              cargo run -q -p wasm_size -- compare \
                --base-label "$BASE_LABEL" --source-base "$SOURCE_BASE" \
                base.json head.json
              echo
              echo "Compared against \`${{ github.event.pull_request.base.sha || github.sha }}\`."
            else
              echo 'No baseline to compare against, reporting absolute sizes.'
              echo
              cargo run -q -p wasm_size -- measure
            fi
            echo
            echo '<sub>Measured after `wasm-opt --enable-custom-page-sizes -Os`.'
            echo '`Code` is function bodies, `Data` is initialised memory. A'
            echo 'const-encoded command moves its payload from code into data.</sub>'
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: |
            report.md
            head.json

      # Fork pull requests get a read-only token, so the API write would fail.
      # The job summary above still carries the table.
      - name: Comment on the pull request
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- fprime-wasm-size -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // One sticky comment, identified by the marker, so a busy pull
            // request does not accumulate a size comment per push.
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
